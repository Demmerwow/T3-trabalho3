<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vice Task - Gerenciador de Tarefas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="main-header">
        <h1>VICE<span>TASK</span></h1>
        <p>Organize suas missões em Vice City</p>
        <button id="btn-tema" class="btn-tema">🌙 Modo Claro</button>
    </header>

    <main class="container">
        <!-- FORMULÁRIO DE CAPTURA RÁPIDA -->
        <section class="form-section">
            <form id="form-tarefa" class="captura-rapida">
                <input type="text" id="input-titulo" placeholder="O que precisa ser feito?" required autocomplete="off">
                <button type="submit" class="btn-neon">+</button>
            </form>
            <!-- Detalhes Adicionais (aparecem ao clicar em +) -->
            <div id="detalhes-tarefa" class="detalhes-tarefa" style="display: none;">
                <textarea id="input-descricao" placeholder="Notas adicionais (opcional)"></textarea>
                <div class="row-inputs">
                    <select id="select-prioridade">
                        <option value="baixa">🟢 Baixa</option>
                        <option value="media" selected>🟡 Média</option>
                        <option value="alta">🔴 Alta</option>
                    </select>
                    <input type="date" id="input-data">
                    <select id="select-categoria">
                        <option value="pessoal">Pessoal</option>
                        <option value="trabalho">Trabalho</option>
                        <option value="estudos">Estudos</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- FILTROS INTELIGENTES -->
        <section class="controls-section">
            <div class="filtros">
                <button class="btn-filtro active" data-filtro="todas">Todas</button>
                <button class="btn-filtro" data-filtro="hoje">Hoje</button>
                <button class="btn-filtro" data-filtro="proximas">Próximas</button>
                <button class="btn-filtro" data-filtro="concluidas">Concluídas</button>
            </div>
            <input type="text" id="input-busca" placeholder="🔍 Buscar...">
        </section>

        <!-- ESTATÍSTICAS -->
        <section class="stats-section">
            <div class="stat-card"><span id="stat-total">0</span><p>Total</p></div>
            <div class="stat-card"><span id="stat-ativas">0</span><p>Ativas</p></div>
            <div class="stat-card"><span id="stat-concluidas">0</span><p>Concluídas</p></div>
        </section>

        <!-- LISTA DE TAREFAS -->
        <section class="lista-section">
            <ul id="lista-tarefas"></ul>
        </section>
    </main>

    <script src="js/storage.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
